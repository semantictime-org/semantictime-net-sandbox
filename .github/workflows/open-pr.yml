name: open-pr

# 人（または Claude Code の push 専用 PAT）が content/* か fix/* を push したら、
# GitHub App の名前で PR を作る。作成者が App になるので、人が承認できる。
on:
  push:
    branches:
      - "content/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $BRANCH"
            exit 0
          fi
          title="$(git log -1 --format=%s)"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body-file .github/pull_request_template.md
